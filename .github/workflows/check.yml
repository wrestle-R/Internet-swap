name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            next/package-lock.json
            tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix next && npm run build --prefix next
      - run: npm ci --prefix tauri && npm run build --prefix tauri
      - run: cargo test --locked --no-default-features --manifest-path tauri/src-tauri/Cargo.toml
      - run: cargo build --locked --no-default-features --manifest-path tauri/src-tauri/Cargo.toml
      - run: python3 tauri/tests/daemon_integration.py tauri/src-tauri/target/debug/internet-swap
