[package]
name = "internet-swap"
version = "0.1.2"
edition = "2021"
description = "A small Linux Wi-Fi companion"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tauri = { version = "2", optional = true , features = [] }
